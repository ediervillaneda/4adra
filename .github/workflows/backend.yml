name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/backend.yml'
  workflow_call: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Formato · Lint · Tipos · Pruebas · Migraciones · Integración · Contrato · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar scaffolding (backend/package.json)
        id: scaffold
        run: |
          if [ -f backend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/package.json no existe todavía. Este job no falla mientras el scaffolding real no exista."
          fi

      - name: Configurar Node.js
        if: steps.scaffold.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (npm ci)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Formato (Prettier)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run format:check

      - name: Lint (ESLint estricto)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint

      - name: Comprobación de tipos (tsc --noEmit)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck

      - name: Pruebas unitarias con cobertura (Vitest)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm test

      - name: Migraciones D1 en limpio (local)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run db:migrate:local

      - name: Pruebas de integración (runtime de Workers + D1 local)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run test:integration

      - name: Pruebas de contrato (docs/api/openapi.yaml)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run test:contract

      - name: Análisis de dependencias (npm audit)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Build de la PWA (los assets del Worker son web/dist)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build (wrangler deploy --dry-run)
        if: steps.scaffold.outputs.exists == 'true'
        working-directory: backend
        run: npm run build
