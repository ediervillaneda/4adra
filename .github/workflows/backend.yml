name: Backend CI

# Backend CI: valida el Worker (backend/) en todos los PR, sin filtro de carpetas: el check "Backend CI"
# es obligatorio para mergear a main (protección de rama). También corre en cada push a develop que toque
# backend/ o el contrato OpenAPI. En main no se repite tras el merge: el PR ya lo validó y
# deploy-cloudflare.yml hace su propio build. En orden:
#   1. Formato (Prettier), lint (ESLint) y tipos (tsc).
#   2. Pruebas unitarias con umbrales de cobertura.
#   3. Migraciones D1 en limpio, pruebas de integración (runtime de Workers + D1 local) y de contrato.
#   4. Lint del contrato OpenAPI (Redocly) y npm audit.
#   5. Build de la PWA y wrangler deploy --dry-run.
# No despliega nada ni usa secrets.

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/backend.yml'
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Este nombre es el check obligatorio de main: no cambiarlo sin actualizar la protección de rama.
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (npm ci)
        working-directory: backend
        run: npm ci

      - name: Formato (Prettier)
        working-directory: backend
        run: npm run format:check

      - name: Lint (ESLint estricto)
        working-directory: backend
        run: npm run lint

      - name: Comprobación de tipos (tsc --noEmit)
        working-directory: backend
        run: npm run typecheck

      - name: Pruebas unitarias con cobertura (Vitest)
        working-directory: backend
        run: npm test

      - name: Migraciones D1 en limpio (local)
        working-directory: backend
        run: npm run db:migrate:local

      - name: Pruebas de integración (runtime de Workers + D1 local)
        working-directory: backend
        run: npm run test:integration

      - name: Pruebas de contrato (docs/api/openapi.yaml)
        working-directory: backend
        run: npm run test:contract

      - name: Lint del contrato OpenAPI (Redocly)
        run: npx --yes @redocly/cli@2.77.0 lint docs/api/openapi.yaml

      - name: Análisis de dependencias (npm audit)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Build de la PWA (los assets del Worker son web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build (wrangler deploy --dry-run)
        working-directory: backend
        run: npm run build
