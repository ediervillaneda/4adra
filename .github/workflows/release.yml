name: Release

# Publicar una versión (docs/Workflows.md):
#   1. PR release/<versión> → main con CHANGELOG.md y package.json en <versión>.
#      El merge despliega a producción (deploy-cloudflare.yml).
#   2. git tag -a v<versión> origin/main -m "Release <versión>" && git push origin v<versión>
# Este workflow valida el tag y crea el GitHub Release con la sección de CHANGELOG.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar el tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag $GITHUB_REF_NAME no apunta a un commit de main."
            exit 1
          fi
          for pkg in backend/package.json web/package.json; do
            found=$(node -p "require('./$pkg').version")
            if [ "$found" != "$version" ]; then
              echo "::error::$pkg tiene la versión $found y el tag es $version."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extraer las notas de CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md no tiene la sección [${{ steps.version.outputs.version }}]."
            exit 1
          fi

      - name: Crear el GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
