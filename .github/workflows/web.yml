name: Web CI

# Web CI: valida la PWA (web/) en todos los PR, sin filtro de carpetas: el check "Web CI" es obligatorio
# para mergear a main (protección de rama). También corre en cada push a develop que toque web/. En main no
# se repite tras el merge: el PR ya lo validó y deploy-cloudflare.yml hace su propio build.
# En orden: lint (angular-eslint), pruebas con cobertura (Vitest, umbral 70 %), npm audit y build de
# producción (web/dist/web/browser, los Static Assets del Worker). No despliega nada ni usa secrets.

on:
  push:
    branches: [develop]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    # Este nombre es el check obligatorio de main: no cambiarlo sin actualizar la protección de rama.
    name: Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias (npm ci)
        working-directory: web
        run: npm ci

      - name: Lint (Angular ESLint)
        working-directory: web
        run: npm run lint

      - name: Pruebas unitarias con cobertura (Vitest)
        working-directory: web
        run: npm test

      - name: Análisis de dependencias (npm audit)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Build de producción
        working-directory: web
        run: npm run build
