name: Deploy Cloudflare (Production)

# Git Flow (ADR-013, docs/Decisions.md): el único disparador de un deploy real es un push a
# main, y a main solo llega código vía release.yml (release/* o hotfix/*). Publica el Worker
# `4adra` en https://4adra.edier.me (ADR-014). Requiere los secrets CLOUDFLARE_API_TOKEN y
# CLOUDFLARE_ACCOUNT_ID (docs/Deployment.md); mientras no existan, el job se omite sin fallar.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloudflare.yml'

concurrency:
  group: deploy-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migraciones D1 y deploy del Worker (production)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets requeridos
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan los secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID (ver docs/Deployment.md). Se omite el deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        if: steps.guard.outputs.ready == 'true'
        working-directory: backend
        run: npm ci

      - name: Build (wrangler deploy --dry-run)
        if: steps.guard.outputs.ready == 'true'
        working-directory: backend
        run: npm run build

      - name: Aplicar migraciones D1 (remoto)
        if: steps.guard.outputs.ready == 'true'
        working-directory: backend
        run: npm run db:migrate:remote

      - name: Deploy del Worker
        if: steps.guard.outputs.ready == 'true'
        working-directory: backend
        run: npx wrangler deploy
